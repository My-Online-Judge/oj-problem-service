server:
  port: 8080

spring:
  application:
    name: problem-service
  # Serialize any Instant/Date/Calendar JSON in Vietnam time (GMT+7). LocalDateTime fields are naive
  # and unaffected by this — those are pinned via TimeZone.setDefault in ProblemServiceApplication.main.
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  profiles:
    active: @spring.profiles.active@
  flyway:
    enabled: true
    locations: classpath:db/migration
  grpc:
    server:
      # The internal API on its own Netty server. With the servlet stack present Spring gRPC would otherwise
      # serve gRPC through Tomcat on the HTTP port.
      port: ${GRPC_PORT:9090}
      servlet:
        enabled: false
      # Callers compile against oj-common's stubs; nothing needs to discover the API at runtime.
      reflection:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      # Statistics are rebuilt from the whole topic when the group is new; counting is idempotent.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Only the dead-letter publisher produces: it forwards the record as it was read.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        # Explicit allowlist, NOT '*': a heap dump or the env endpoint would leak credentials.
        include: health,info,prometheus,metrics
  endpoint:
    heapdump:
      access: none
    threaddump:
      access: none

logging:
  level:
    root: INFO
    web: INFO
  pattern:
    # trace_id is put in the MDC by the OpenTelemetry Java agent; it links a log line to its trace in Jaeger.
    correlation: "[%X{trace_id:-}] [%X{submissionId:-}] "

oj:
  rpc:
    # Shared with the callers of the internal gRPC API (judge-api); see ServiceTokenServerInterceptor.
    token: ${PROBLEM_RPC_TOKEN:}
  security:
    jwt:
      # identity-service issues the access tokens and publishes their public key; fetched lazily, on
      # the first request that carries a token.
      jwks-uri: ${OJ_JWKS_URI:http://identity-service:8000/.well-known/jwks.json}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:test-cases}
  bundle-retention: ${MINIO_BUNDLE_RETENTION:3}
