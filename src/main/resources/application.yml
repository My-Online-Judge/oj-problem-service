server:
  port: 8080

spring:
  application:
    name: problem-service
  # Serialize any Instant/Date/Calendar JSON in Vietnam time (GMT+7). LocalDateTime fields are naive
  # and unaffected by this — those are pinned via TimeZone.setDefault in ProblemServiceApplication.main.
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  profiles:
    active: @spring.profiles.active@
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        # Explicit allowlist, NOT '*': a heap dump or the env endpoint would leak credentials.
        include: health,info,prometheus,metrics
  endpoint:
    heapdump:
      access: none
    threaddump:
      access: none

logging:
  level:
    root: INFO
    web: INFO
  pattern:
    # trace_id is put in the MDC by the OpenTelemetry Java agent; it links a log line to its trace in Jaeger.
    correlation: "[%X{trace_id:-}] [%X{submissionId:-}] "

oj:
  security:
    jwt:
      # identity-service issues the access tokens and publishes their public key; fetched lazily, on
      # the first request that carries a token.
      jwks-uri: ${OJ_JWKS_URI:http://identity-service:8000/.well-known/jwks.json}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:test-cases}
  bundle-retention: ${MINIO_BUNDLE_RETENTION:3}
