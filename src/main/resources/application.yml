server:
  port: 8080

spring:
  application:
    name: problem-service
  # Serialize any Instant/Date/Calendar JSON in Vietnam time (GMT+7). LocalDateTime fields are naive
  # and unaffected by this — those are pinned via TimeZone.setDefault in ProblemServiceApplication.main.
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  mvc:
    async:
      # A package export streams asynchronously; Tomcat's default (30 s) would cut a large one off. The portal waits
      # 120 s, and the gateway sets no response timeout, so this is the limit end to end.
      request-timeout: 120s
  jpa:
    # Off: with open-in-view the request's EntityManager keeps the JDBC connection it first used until the response
    # is written, so a package export would hold one through its whole stream of MinIO reads. Every HTTP path reads
    # entities inside a transaction or through projections.
    open-in-view: false
  profiles:
    active: @spring.profiles.active@
  flyway:
    enabled: true
    locations: classpath:db/migration
  grpc:
    server:
      # The internal API on its own Netty server. With the servlet stack present Spring gRPC would otherwise
      # serve gRPC through Tomcat on the HTTP port.
      port: ${GRPC_PORT:9090}
      servlet:
        enabled: false
      # Callers compile against oj-common's stubs; nothing needs to discover the API at runtime.
      reflection:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      # Statistics are rebuilt from the whole topic when the group is new; counting is idempotent.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Only the dead-letter publisher produces: it forwards the record as it was read.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      # A listener that subscribes before its ACLs exist gets TOPIC_AUTHORIZATION_FAILED; without this interval Spring
      # Kafka stops that container for good and the statistics stop counting until a restart. On K3s nothing orders
      # this pod after the kafka-init Job, as compose's depends_on does, so keep retrying until the ACLs are there.
      auth-exception-retry-interval: 5s

management:
  endpoints:
    web:
      exposure:
        # Explicit allowlist, NOT '*': a heap dump or the env endpoint would leak credentials.
        include: health,info,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
  endpoint:
    heapdump:
      access: none
    threaddump:
      access: none

logging:
  level:
    root: INFO
    web: INFO
  pattern:
    # trace_id is put in the MDC by the OpenTelemetry Java agent; it links a log line to its trace in Jaeger.
    correlation: "[%X{trace_id:-}] [%X{submissionId:-}] "

oj:
  testcases:
    # After a bundle-format change (TestCaseBundleBuilder.FORMAT_VERSION) rebuild every bundle once, in the background.
    republish-on-start: true
  rpc:
    # Optional: the tls profile authenticates gRPC callers by certificate. When set (32+ characters), every call
    # must also carry it as x-oj-service-token; see GrpcServerConfig.
    token: ${PROBLEM_RPC_TOKEN:}
  identity:
    # identity-service's public profiles: the scoreboard's usernames, through oj-common's PublicUserClient (cached 5 min).
    base-url: ${OJ_IDENTITY_URI:http://identity-service:8000}
  security:
    jwt:
      # identity-service issues the access tokens and publishes their public key; fetched lazily, on
      # the first request that carries a token.
      jwks-uri: ${OJ_JWKS_URI:http://identity-service:8000/.well-known/jwks.json}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:test-cases}
  bundle-retention: ${MINIO_BUNDLE_RETENTION:3}
