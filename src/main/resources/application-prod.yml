spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
server:
  port: 8000

management:
  server:
    # Actuator (health, prometheus) on its own port, like the gateway. Only the dev/prod profiles set
    # it: under the test profile MockMvc must still reach /actuator on the main context.
    port: 8081

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    vn.thanhtuanle: INFO
  file:
    name: log/app.log
