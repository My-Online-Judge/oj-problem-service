spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    hibernate:
      ddl-auto: validate
server:
  port: 8000

management:
  server:
    # Actuator (health, prometheus) on its own port, like the gateway. Only the dev/prod profiles set
    # it: under the test profile MockMvc must still reach /actuator on the main context.
    port: 8081

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
openapi:
  service:
    api-docs: problem-service
    server: http://localhost:${server.port}
    title: Problem service
    version: 1.0.0

logging:
  level:
    vn.thanhtuanle: DEBUG
  file:
    name: log/app.log
