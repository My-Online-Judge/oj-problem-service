# Internal TLS (sub-project 10). Switched on with SPRING_PROFILES_INCLUDE=tls; the certificates are mounted at
# ${OJ_TLS_DIR} (docker-compose.yml: the tls volume, subpath = this service's name). Missing files fail the startup.
# Spring Boot orders spring.profiles.include profiles before the active ones, so an active profile's file
# (application-prod.yml, application-dev.yml) wins over this one: never set a TLS key there too.
spring:
  ssl:
    bundle:
      pem:
        oj:
          keystore:
            certificate: ${OJ_TLS_DIR:/etc/oj/tls}/tls.crt
            private-key: ${OJ_TLS_DIR:/etc/oj/tls}/tls.key
          truststore:
            certificate: ${OJ_TLS_DIR:/etc/oj/tls}/ca.crt
  datasource:
    hikari:
      data-source-properties:
        sslmode: verify-full
        sslrootcert: ${OJ_TLS_DIR:/etc/oj/tls}/ca.crt
        sslcert: ${OJ_TLS_DIR:/etc/oj/tls}/tls.crt
        sslkey: ${OJ_TLS_DIR:/etc/oj/tls}/tls.key
  kafka:
    # Listener INTERNAL: TLS, the broker verified against the CA (and its host name), this service's certificate presented.
    security:
      protocol: SSL
    ssl:
      bundle: oj
  grpc:
    server:
      # The internal API (9090) serves TLS and requires a CA-signed client certificate; only the CNs in
      # oj.tls.grpc-allowed-clients get past oj-common's PeerIdentityServerInterceptor (PERMISSION_DENIED otherwise).
      # The certificate replaces the service token (GrpcServerConfig).
      ssl:
        enabled: true
        bundle: oj
        client-auth: require
# The API (server.port) and actuator (management.server.port) ports serve TLS and require a CA-signed client
# certificate. On the API port only the CNs below get past oj-common's PeerCertificateFilter (403 otherwise); the
# actuator port has no CN allowlist (Prometheus and the healthcheck present their own certificates). Management SSL
# needs a separate management.server.port (dev and prod set 8081): on the main port, Spring Boot refuses to start.
server:
  ssl:
    bundle: oj
    client-auth: need
management:
  server:
    ssl:
      enabled: true
      bundle: oj
      client-auth: need
  health:
    ssl:
      certificate-validity-warning-threshold: 30d
# MinIO (https://minio:9000): its certificate is verified against the CA of this bundle (MinioConfig).
minio:
  ssl-bundle: oj
oj:
  tls:
    allowed-clients: api-gateway
    grpc-allowed-clients: submission-service
  # Public profiles (scoreboard usernames), over TLS with this service's certificate, like the JWKS fetch below.
  identity:
    base-url: https://identity-service:8000
    ssl-bundle: oj
  security:
    jwt:
      jwks-uri: https://identity-service:8000/.well-known/jwks.json
      jwks-ssl-bundle: oj
