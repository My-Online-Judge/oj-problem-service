spring:
  config:
    activate:
      on-profile: test
  devtools:
    add-properties: true
  datasource:
    # Spring Boot's embedded H2 URL, plus PostgreSQL mode so the Postgres statements the services use (INSERT ... ON
    # CONFLICT DO NOTHING) run here too. The random name keeps one database per test context, as the default did.
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  grpc:
    server:
      # Several cached test contexts each start a server: a free port each instead of 9090.
      port: 0
  kafka:
    # No broker in most tests; the Kafka tests start an embedded one and turn both back on. Without this
    # every context waits ~40 s for KafkaAdmin to give up creating the topics.
    admin:
      auto-create: false
    listener:
      auto-startup: false
  flyway:
    # Tests run on in-memory H2 with the schema built from entities (ddl-auto above).
    # The Flyway migrations are Postgres-specific, so Flyway stays off for the test profile.
    enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
openapi:
  service:
    api-docs: problem-service
    server: ${BACKEND_SERVICE:http://localhost:${server.port}}
    title: Problem service
    version: 1.0.0

oj:
  rpc:
    token: test-only-service-token-0123456789abcdef
  testcases:
    republish-on-start: false
